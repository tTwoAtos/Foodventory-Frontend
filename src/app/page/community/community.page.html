<ion-content [fullscreen]="true">
  <div class="community-page">
    <ion-text class="community-title">
      <h2>Mes communautés</h2>
    </ion-text>

    <ion-list class="community-list">
      <app-info-card *ngFor=" let data of datas" [name]="data.name" [nb]="data.productAmount" [icon]="icon"
        (click)="router.navigateByUrl('/login')"></app-info-card>
    </ion-list>
  </div>
</ion-content>
