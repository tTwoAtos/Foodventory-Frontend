<ion-content [fullscreen]="true">
  <app-header [headerIcon]="headerIcon" [headerTitle]="headerTitle"></app-header>

  <div class="home-page">
    <div class="home-community">
      <h2>Les Alternés</h2>
      <hr>
    </div>


    <div class="home-communities">
      <ion-text class="home-title">
        <h3>Mes communautés</h3>
      </ion-text>

      <ion-list class="home-list">
        <app-info-card *ngFor=" let data of datas" [name]="data.name" [nb]="data.productAmount" [icon]="icon"
          (click)="router.navigateByUrl('/stock')"></app-info-card>
      </ion-list>
    </div>
  </div>
</ion-content>

<app-footer></app-footer>
