<app-header [headerTitle]="'Panier'"></app-header>

<ion-content [fullscreen]="true">
    <ion-list class="product-list">
        <app-product-card
            *ngFor="let product of productList"
            [product]="product"
        ></app-product-card>
    </ion-list>

    <ion-button (click)="saveBasket()" *ngIf="productList.length > 0">
        <ion-label>Valider</ion-label>
    </ion-button>
</ion-content>

<app-footer></app-footer>
